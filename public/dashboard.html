<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Sentinel — Keys</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/0camm/sentinel/main/Sentinel.png">
<link rel="stylesheet" href="/style.css">
<script src="/config.js?v=3"></script>
</head>
<body>
  <div class="page">
    <div class="top-row">
      <div class="header-brand" style="margin-bottom:0;">
        <img class="header-logo" src="https://raw.githubusercontent.com/0camm/sentinel/main/Sentinel.png" alt="Sentinel logo">
        <div>
          <div class="brand-title">Sentinel Key Dashboard</div>
          <div class="brand-sub" id="key-count">Loading keys...</div>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn" type="button">Log out</button>
    </div>

    <div class="tabs" role="tablist" aria-label="Key sections">
      <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="keys-view" type="button" data-view="keys-view">Keys</button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="history-view" type="button" data-view="history-view">History</button>
    </div>

    <div class="view active" id="keys-view" role="tabpanel">
      <div class="gen-row">
        <select id="gen-count" aria-label="How many keys">
          <option value="1">1 key</option>
          <option value="5">5 keys</option>
          <option value="10">10 keys</option>
          <option value="25">25 keys</option>
          <option value="50">50 keys</option>
        </select>
        <button class="copy-btn" id="gen-btn" type="button">Generate keys</button>
        <span class="gen-status" id="gen-status"></span>
      </div>
      <div class="key-list" id="key-list"></div>
    </div>

    <div class="view" id="history-view" role="tabpanel">
      <div class="key-list" id="history-list"></div>
    </div>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
